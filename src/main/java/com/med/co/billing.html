<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MED.CO Billing</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f5f9;
    padding:30px;
}

.container{

    max-width:1100px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,.15);

}

h1{

    text-align:center;
    color:#1565c0;
    margin-bottom:25px;

}

.section{

    margin-top:25px;

}

.section h2{

    margin-bottom:15px;
    color:#444;
    border-left:5px solid #1565c0;
    padding-left:10px;

}

.row{

    display:flex;
    gap:20px;
    margin-bottom:15px;

}

.col{

    flex:1;

}

label{

    display:block;
    margin-bottom:5px;
    font-weight:bold;

}

input{

    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;

}

table{

    width:100%;
    border-collapse:collapse;
    margin-top:15px;

}

table th{

    background:#1565c0;
    color:white;
    padding:10px;

}

table td{

    border:1px solid #ddd;
    padding:8px;

}

table input{

    width:100%;

}

.action-btn{

    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    color:white;
    cursor:pointer;
    font-size:18px;

}

.add{

    background:green;

}

.remove{

    background:red;

}

.summary{

    width:350px;
    margin-left:auto;
    margin-top:25px;

}

.summary table td{

    border:none;
    padding:8px;

}

.summary table tr:last-child{

    font-size:20px;
    font-weight:bold;
    color:#1565c0;

}

.button{

    margin-top:25px;
    text-align:center;

}

.button button{

    background:#1565c0;
    color:white;
    border:none;
    padding:12px 35px;
    font-size:17px;
    border-radius:6px;
    cursor:pointer;

}

.button button:hover{

    background:#0d47a1;

}

</style>

</head>

<body>

<div class="container">

<h1>MED.CO Hospital Billing</h1>

<div class="section">

<h2>Patient Details</h2>

<div class="row">

<div class="col">
<label>Patient ID</label>
<input type="number">
</div>

<div class="col">
<label>Patient Name</label>
<input type="text">
</div>

<div class="col">
<label>Invoice Date</label>
<input type="date">
</div>

</div>

</div>


<div class="section">

<h2>Doctor Consultation</h2>

<div class="row">

<div class="col">
<label>Doctor Name</label>
<input type="text">
</div>

<div class="col">
<label>Specialization</label>
<input type="text">
</div>

<div class="col">
<label>Doctor Fee</label>
<input type="number">
</div>

</div>

</div>



<div class="section">

<h2>Medicines</h2>

<table id="medicineTable">

<thead>

<tr>

<th>Medicine Name</th>

<th>Quantity</th>

<th>Unit Price</th>

<th>Action</th>

</tr>

</thead>

<tbody>

<tr>

<td><input type="text"></td>

<td><input type="number"></td>

<td><input type="number" step="0.01"></td>

<td style="text-align:center">

<button class="action-btn add" onclick="addRow()">+</button>

</td>

</tr>

</tbody>

</table>

</div>



<div class="summary">

<table>

<tr>

<td>Doctor Fee</td>

<td>₹500</td>

</tr>

<tr>

<td>Medicine Total</td>

<td>₹40</td>

</tr>

<tr>

<td>Service Charge</td>

<td>₹10</td>

</tr>

<tr>

<td>Tax</td>

<td>₹27.5</td>

</tr>

<tr>

<td>Total Amount</td>

<td>₹577.5</td>

</tr>

</table>

</div>


<div class="button">

<button>

Generate Invoice

</button>

</div>

</div>



<script>

function addRow(){

let table=document.getElementById("medicineTable").getElementsByTagName("tbody")[0];

let row=table.insertRow();

row.innerHTML=

`

<td><input type="text"></td>

<td><input type="number"></td>

<td><input type="number" step="0.01"></td>

<td style="text-align:center">

<button class="action-btn remove" onclick="removeRow(this)">-</button>

</td>

`;

}

function removeRow(btn){

let row=btn.parentNode.parentNode;

row.remove();

}

</script>

</body>
</html>
